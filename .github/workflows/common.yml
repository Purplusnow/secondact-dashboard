# 전체 앱 공통지표 — 앱마다 BigQuery 경량 쿼리 → docs/data/common.json
#
# ⚠ BigQuery 를 쓰므로 **수동 실행만** 한다(HANDOFF §1 원칙). schedule 을 달지 말 것.
# 앱당 수십~수백 MB(읽는 컬럼 6개뿐). 드라이런으로 먼저 재고 MAX_GB 를 넘으면 그 앱은 건너뛴다.
#
# 키: 앱마다 GitHub Secret 하나(서비스계정 JSON 원문). 이름은 docs/data/apps.json 의 secret.
# 비어 있으면 그 앱은 status=no_secret 로 남고 화면엔 '미연결'로 뜬다 — 실패가 아니다.
name: common

on:
  workflow_dispatch:
    inputs:
      days:
        description: '다시 계산할 일수 (기본 45 · 처음 붙는 앱 백필은 120)'
        required: false
        default: '45'
      only:
        description: '이 앱만 (apps.json 의 key, 쉼표로 여러 개). 비우면 전부'
        required: false
        default: ''

permissions:
  contents: write

# daily.json 은 안 쓰지만 같은 main 에 푸시하므로 같은 그룹에 둔다(HANDOFF: 그룹을 쪼개지 말 것).
concurrency:
  group: push-docs-data
  cancel-in-progress: false

jobs:
  common:
    runs-on: ubuntu-latest
    env:
      DAYS: ${{ inputs.days || 45 }}
      ONLY: ${{ inputs.only }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_SA_CROWNCOIN: ${{ secrets.GCP_SA_CROWNCOIN }}
      GCP_SA_PLOPCAT: ${{ secrets.GCP_SA_PLOPCAT }}
      GCP_SA_BEEARCHITECT: ${{ secrets.GCP_SA_BEEARCHITECT }}
      GCP_SA_GYROGRID: ${{ secrets.GCP_SA_GYROGRID }}
      GCP_SA_WORLDREST: ${{ secrets.GCP_SA_WORLDREST }}
      GCP_SA_ONELINEPATH: ${{ secrets.GCP_SA_ONELINEPATH }}
      GCP_SA_RAINLOOPSUSHI: ${{ secrets.GCP_SA_RAINLOOPSUSHI }}
      GCP_SA_BADUK: ${{ secrets.GCP_SA_BADUK }}
      GCP_SA_ABYSSLANTERN: ${{ secrets.GCP_SA_ABYSSLANTERN }}
      GCP_SA_DRAKEWING: ${{ secrets.GCP_SA_DRAKEWING }}
      GCP_SA_HAEDAMHOUSE: ${{ secrets.GCP_SA_HAEDAMHOUSE }}
      GCP_SA_MERGERAILWAY: ${{ secrets.GCP_SA_MERGERAILWAY }}
      GCP_SA_POCKETARCADE: ${{ secrets.GCP_SA_POCKETARCADE }}
      GCP_SA_FACELAPSE: ${{ secrets.GCP_SA_FACELAPSE }}
      GCP_SA_PRIVATECAM: ${{ secrets.GCP_SA_PRIVATECAM }}
      GCP_SA_HAEMU: ${{ secrets.GCP_SA_HAEMU }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-cloud-bigquery
      - name: 공통지표 수집
        run: python3 tools/common.py
      # 게임별 맞춤 인게임 지표(tools/gamespecs.json). event_params 를 읽어 공통지표보다 무겁다 — 드라이런 상한 적용.
      - name: 게임별 인게임 지표
        continue-on-error: true   # 실패해도 공통지표는 커밋한다
        run: python3 tools/gamestats.py
      # 유저 의견 '건수'만(Firestore). 내용은 읽지 않는다 — 공개 레포라서.
      - name: 유저 의견 건수
        continue-on-error: true   # 실패해도 공통지표는 커밋한다
        run: python3 tools/feedback.py
      # 인생 2막 인앱(GA4 purchase) — 판매 리포트가 오기 전 '오늘·어제' 인앱을 채운다.
      # 원래 realtime 워크플로 안에 있었는데, '업데이트'가 sync+common 으로 바뀐 뒤 빠져서
      # 오늘 인앱이 늘 0 으로 보였다(2026-11-10). 마지막으로 훑은 날 이후만 읽는다.
      - name: 인생 2막 인앱(GA4)
        continue-on-error: true
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" python3 tools/iap.py
      - name: 커밋
        run: |
          git config user.name  "secondact-bot"
          git config user.email "34591718+Purplusnow@users.noreply.github.com"
          # common·gamestats·feedback.json 은 이 잡만 쓴다 — 밀리면 최신 위에 내 파일만 얹어 다시 민다.
          # daily.json(iap 필드)은 sync 와 공유라 복사하지 않고 다시 수집한다.
          FILES="docs/data/common.json"
          for f in docs/data/feedback.json docs/data/gamestats.json; do [ -f "$f" ] && FILES="$FILES $f"; done
          mkdir -p "$RUNNER_TEMP/keep" && cp $FILES "$RUNNER_TEMP/keep/"
          for i in 1 2 3; do
            git add $FILES docs/data/daily.json
            git diff --cached --quiet && { echo "변경 없음"; exit 0; }
            git commit -q -m "공통지표 수집: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            git push -q && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP"/keep/* docs/data/
            # daily.json 은 sync 와 같이 쓴다 — 덮어쓰지 말고 최신 위에서 iap 만 다시 받는다(sync.yml 과 같은 방식)
            python3 tools/iap.py || true
            sleep $((i * 3))
          done
          exit 1
