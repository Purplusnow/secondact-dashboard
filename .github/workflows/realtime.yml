# 실시간(스트리밍) 현황 수집 — BigQuery events_intraday_* → docs/data/realtime.json
#
# ingame.yml 과 의도적으로 분리돼 있다. intraday 는 후처리 전이고 '하루가 덜 찬' 값이라
# 완결 지표(리텐션·코호트)와 절대 섞지 않는다. 데이터 파일도 뷰도 따로다.
#
# 주기: 매시간. BigQuery 무료 구간은 월 1TB 쿼리 처리량이고, 이 작업은 intraday 테이블만
# 스캔해서 한 번에 수십 MB 수준이다. 실제 스캔량을 realtime.json 의 scan_mb 에 기록하니
# 몇 번 돌려보고 월 환산치를 확인할 것 — 넘칠 것 같으면 cron 을 줄이면 된다.
name: realtime

on:
  schedule:
    - cron: '5 * * * *'           # 매시 5분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  realtime:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성
        if: env.GCP_SA_KEY != ''
        run: pip install --quiet google-cloud-bigquery

      - name: 서비스계정 키 파일화
        if: env.GCP_SA_KEY != ''
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 실시간 데이터 수집
        if: env.GCP_SA_KEY != ''
        run: python3 tools/realtime.py

      # 인앱매출은 Play Console 이 주문 목록 API 를 안 줘서 손으로 넣고 있었다.
      # 게임이 GA4 표준 purchase(value·currency)를 쏘므로 그쪽으로 받는다 — 같은 자격증명으로
      # 이미 돌고 있는 이 잡에 얹는 게 제일 싸다. 손으로 넣은 날은 건드리지 않는다.
      - name: 인앱매출 수집
        if: env.GCP_SA_KEY != ''
        run: python3 tools/iap.py

      - name: 커밋
        if: env.GCP_SA_KEY != ''
        run: |
          # git diff 는 '추적되지 않는 파일'을 못 본다 — 최초 생성 때 변경 없음으로 오판한다.
          # 그래서 먼저 add 하고 스테이지와 비교한다.
          git config user.name  "secondact-bot"
          git config user.email "34591718+Purplusnow@users.noreply.github.com"
          git add docs/data/realtime.json docs/data/daily.json
          if git diff --cached --quiet -- docs/data/realtime.json docs/data/daily.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "실시간 수집: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
          git push
