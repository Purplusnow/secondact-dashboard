# 실시간(스트리밍) 현황 수집 — BigQuery events_intraday_* → docs/data/realtime.json
#
# ingame.yml 과 의도적으로 분리돼 있다. intraday 는 후처리 전이고 '하루가 덜 찬' 값이라
# 완결 지표(리텐션·코호트)와 절대 섞지 않는다. 데이터 파일도 뷰도 따로다.
#
# 주기: 매시간. BigQuery 무료 구간은 월 1TB 쿼리 처리량이고, 이 작업은 intraday 테이블만
# 스캔해서 한 번에 수십 MB 수준이다. 실제 스캔량을 realtime.json 의 scan_mb 에 기록하니
# 몇 번 돌려보고 월 환산치를 확인할 것 — 넘칠 것 같으면 cron 을 줄이면 된다.
name: realtime

# ⚠ 자동 실행(schedule)을 전부 뗐다(형 지시 2026-10-22). 이 보드는 형이 볼 때만
# 최신이면 되는데, 예약 실행이 BigQuery 를 계속 긁어 10월에 무료 구간 1TB 를 넘겼다
# (실측 2.16TiB). 이제 **요청할 때만** 돈다 — Actions 탭에서 "Run workflow" 또는
# Claude 에게 "업데이트".
on:
  workflow_dispatch:

permissions:
  contents: write

# ⚠ realtime(iap.py) 과 sync(sync.py) 는 **같은 docs/data/daily.json 을 쓴다.**
# 그래서 두 워크플로가 **하나의 그룹**을 공유한다 — 따로 두면 동시에 떠서 푸시가 밀리고,
# 재시도 리베이스가 같은 파일 같은 줄을 만나 CONFLICT 로 죽는다(2026-10-07 실측:
# "업데이트"로 넷을 한꺼번에 던졌더니 realtime 이 그렇게 실패했다).
# 그룹 이름은 '무엇을 쓰는가'로 짓는다 — 워크플로 이름으로 지으면 또 갈라진다.
concurrency:
  group: push-docs-data
  cancel-in-progress: false

jobs:
  realtime:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - uses: actions/checkout@v4

      # 슬롯을 여러 개 깐 대가로, 같은 시간에 두 번 수집하는 걸 여기서 막는다.
      # 손으로 돌린 건(workflow_dispatch) 언제나 그대로 수집한다 — 지금 보려고 누른 거다.
      - name: 직전 수집 간격 확인
        id: guard
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, datetime
          log = lambda m: print(m, file=sys.stderr)   # stdout 은 $GITHUB_OUTPUT 이라 key=value 만 들어가야 한다
          if os.environ.get("EV") != "schedule":
              print("skip=false"); raise SystemExit
          try:
              with open("docs/data/realtime.json", encoding="utf-8") as f:
                  u = json.load(f)["updated"]            # "2026-10-06 00:35 KST"
              kst = datetime.timezone(datetime.timedelta(hours=9))
              last = datetime.datetime.strptime(u.replace(" KST", ""), "%Y-%m-%d %H:%M").replace(tzinfo=kst)
              mins = (datetime.datetime.now(kst) - last).total_seconds() / 60
          except Exception as e:
              log(f"::warning::직전 수집 시각을 못 읽었습니다({e}) — 그냥 수집합니다")
              print("skip=false"); raise SystemExit
          # 45분: 한 시간에 한 번만 통과시키되, 앞 슬롯이 조금 늦게 떠도 다음 시간대를
          # 막지 않도록 60분보다 짧게 잡는다(네 슬롯 간격이 15분이라 두 번은 안 통과한다).
          skip = mins < 45
          log(f"직전 수집 {mins:.0f}분 전 — {'건너뜀' if skip else '수집'}")
          print("skip=true" if skip else "skip=false")
          PY
        env:
          EV: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성
        if: env.GCP_SA_KEY != '' && steps.guard.outputs.skip != 'true'
        run: pip install --quiet google-cloud-bigquery

      - name: 서비스계정 키 파일화
        if: env.GCP_SA_KEY != '' && steps.guard.outputs.skip != 'true'
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 실시간 데이터 수집
        if: env.GCP_SA_KEY != '' && steps.guard.outputs.skip != 'true'
        run: python3 tools/realtime.py

      # 인앱매출은 Play Console 이 주문 목록 API 를 안 줘서 손으로 넣고 있었다.
      # 게임이 GA4 표준 purchase(value·currency)를 쏘므로 그쪽으로 받는다 — 같은 자격증명으로
      # 이미 돌고 있는 이 잡에 얹는 게 제일 싸다. 손으로 넣은 날은 건드리지 않는다.
      - name: 인앱매출 수집
        if: env.GCP_SA_KEY != '' && steps.guard.outputs.skip != 'true'
        run: python3 tools/iap.py

      - name: 커밋
        if: env.GCP_SA_KEY != '' && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "secondact-bot"
          git config user.email "34591718+Purplusnow@users.noreply.github.com"
          # ⚠ 리베이스로 푸시 충돌을 푸는 건 daily.json 에서 안 통한다(2026-10-07·10-13 실측).
          # realtime(iap.py) 과 sync(sync.py) 가 **같은 파일의 같은 줄**을 고치므로
          # 리베이스가 CONFLICT 로 죽고, 수집은 성공해 놓고 그 회차를 통째로 버린다.
          # concurrency 그룹을 공유해도 체크아웃 시점이 어긋나면 여전히 난다.
          #
          # 그래서 '합치지' 않고 **최신 위에서 다시 수집한다.** 수집기는 제 필드만
          # 건드리므로(sync→ads·admob, iap.py→iap), 남의 최신 값을 덮지 않고 얹힌다.
          push_or_recollect() {
            for i in 1 2 3; do
              git add -A docs/data
              git diff --cached --quiet && { echo "변경 없음 — 커밋 생략"; return 0; }
              git commit -q -m "실시간 수집: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
              git push -q && return 0
              echo "푸시 밀림 — 최신으로 되감고 다시 수집 ($i)"
              git fetch -q origin main && git reset -q --hard origin/main
              sleep $((i * 3))
              "$@" || return 1
            done
            echo "::error::세 번 다시 수집해도 푸시가 안 됩니다"
            return 1
          }
          recollect() {
            python3 tools/realtime.py && python3 tools/iap.py
          }
          push_or_recollect recollect
