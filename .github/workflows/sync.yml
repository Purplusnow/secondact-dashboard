# 마케팅비·광고매출 자동 수집
#
#   마케팅비 — Google Ads 스크립트가 매시간 repository_dispatch 로 쏜다.
#              (Google Ads API가 아니라 계정 내장 스크립트라 개발자 토큰 승인이 필요 없다)
#   광고매출 — 이 워크플로가 매시간 AdMob API를 직접 호출한다.
#
# 인앱매출은 손으로 넣는다 — Play는 주문 목록을 API로 주지 않는다.
name: sync

on:
  schedule:
    - cron: '7 * * * *'          # 매시 7분 (UTC). AdMob 수집용
  workflow_dispatch:
    inputs:
      days:
        description: 'AdMob 조회 일수 (기본 3 · 과거 메울 땐 60 같은 큰 값)'
        required: false
        default: '3'
  repository_dispatch:
    types: [ads-cost]

permissions:
  contents: write

# 같은 파일을 고치므로 절대 겹쳐 돌리지 않는다
# ⚠ realtime(iap.py) 과 sync(sync.py) 는 **같은 docs/data/daily.json 을 쓴다.**
# 그래서 두 워크플로가 **하나의 그룹**을 공유한다 — 따로 두면 동시에 떠서 푸시가 밀리고,
# 재시도 리베이스가 같은 파일 같은 줄을 만나 CONFLICT 로 죽는다(2026-10-07 실측:
# "업데이트"로 넷을 한꺼번에 던졌더니 realtime 이 그렇게 실패했다).
# 그룹 이름은 '무엇을 쓰는가'로 짓는다 — 워크플로 이름으로 지으면 또 갈라진다.
concurrency:
  group: write-daily-json
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    # secrets 컨텍스트는 스텝의 if 에서 못 읽는다. 잡 레벨 env 로 올려야
    # "Secret 이 비었으면 건너뛴다"를 if 로 판정할 수 있다.
    env:
      ADMOB_CLIENT_ID: ${{ secrets.ADMOB_CLIENT_ID }}
      ADMOB_CLIENT_SECRET: ${{ secrets.ADMOB_CLIENT_SECRET }}
      ADMOB_REFRESH_TOKEN: ${{ secrets.ADMOB_REFRESH_TOKEN }}
      ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # client_payload 는 외부 입력이라 쉘에 직접 끼워넣지 않고 env 로만 넘긴다
      - name: 마케팅비 반영
        if: github.event_name == 'repository_dispatch'
        env:
          ADS_ROWS: ${{ toJSON(github.event.client_payload.rows) }}
          GEO_ROWS: ${{ toJSON(github.event.client_payload.geo) }}
        # 국가별(geo)은 선택 — 스크립트 구버전이 보내지 않으면 'null' 이 와서 조용히 건너뛴다.
        run: |
          python3 tools/sync.py --ads-json "$ADS_ROWS"
          if [ "$GEO_ROWS" != "null" ] && [ -n "$GEO_ROWS" ]; then
            python3 tools/sync.py --geo-json "$GEO_ROWS"
          fi

      - name: 광고매출 수집
        if: env.ADMOB_REFRESH_TOKEN != ''
        run: python3 tools/sync.py --admob --days "${{ inputs.days || 3 }}"

      - name: 커밋
        env:
          ADS_ROWS: ${{ toJSON(github.event.client_payload.rows) }}
          GEO_ROWS: ${{ toJSON(github.event.client_payload.geo) }}
          EV: ${{ github.event_name }}
          DAYS: ${{ inputs.days || 3 }}
        run: |
          git config user.name  "secondact-bot"
          git config user.email "34591718+Purplusnow@users.noreply.github.com"
          # ⚠ 리베이스로 푸시 충돌을 푸는 건 daily.json 에서 안 통한다(2026-10-07·10-13 실측).
          # realtime(iap.py) 과 sync(sync.py) 가 **같은 파일의 같은 줄**을 고치므로
          # 리베이스가 CONFLICT 로 죽고, 수집은 성공해 놓고 그 회차를 통째로 버린다.
          # concurrency 그룹을 공유해도 체크아웃 시점이 어긋나면 여전히 난다.
          #
          # 그래서 '합치지' 않고 **최신 위에서 다시 수집한다.** 수집기는 제 필드만
          # 건드리므로(sync→ads·admob, iap.py→iap), 남의 최신 값을 덮지 않고 얹힌다.
          push_or_recollect() {
            for i in 1 2 3; do
              git add -A docs/data
              git diff --cached --quiet && { echo "변경 없음 — 커밋 생략"; return 0; }
              git commit -q -m "자동 수집: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
              git push -q && return 0
              echo "푸시 밀림 — 최신으로 되감고 다시 수집 ($i)"
              git fetch -q origin main && git reset -q --hard origin/main
              sleep $((i * 3))
              "$@" || return 1
            done
            echo "::error::세 번 다시 수집해도 푸시가 안 됩니다"
            return 1
          }
          # 되감은 뒤 다시 돌릴 수집 — 이 잡이 원래 한 일을 그대로 반복한다.
          recollect() {
            if [ "$EV" = "repository_dispatch" ]; then
              python3 tools/sync.py --ads-json "$ADS_ROWS"
              if [ "$GEO_ROWS" != "null" ] && [ -n "$GEO_ROWS" ]; then
                python3 tools/sync.py --geo-json "$GEO_ROWS"
              fi
            fi
            if [ -n "$ADMOB_REFRESH_TOKEN" ]; then python3 tools/sync.py --admob --days "$DAYS"; fi
          }
          push_or_recollect recollect
