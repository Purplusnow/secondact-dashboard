# 유저 한 명 진단 — 수동 실행 전용. 아무것도 커밋하지 않는다.
#
# 목록에서 이상한 줄을 집었을 때 그 유저의 이벤트 흐름을 보려고 쓴다.
# 출력은 Actions 로그로만 간다. 공개 리포라 원본 식별자·IP·기기정보는 찍지 않는다
# (화면에 보이는 6자 해시로 찾고, 게임플레이 이벤트만 꺼낸다).
name: probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '유저 꼬리표 6자 (예: 8bc9b8). scan 이면 비워도 됨'
        required: false
      scan:
        description: 'true 로 두면 시계조작 의심 유저를 훑는다'
        required: false
        default: 'false'
      fake:
        description: 'true 로 두면 결제 위조를 사유별로 분해한다'
        required: false
        default: 'false'
      city:
        description: 'true 로 두면 2부 진입 자격자 수를 센다'
        required: false
        default: 'false'
      vercmp:
        description: 'true 로 두면 버전 코호트를 나이 맞춰 비교한다'
        required: false
        default: 'false'
      pay:
        description: 'true 로 두면 Play 에만 있는 결제를 역추적한다 (country·cur 같이 입력)'
        required: false
        default: 'false'
      country:
        description: '--pay 용 국가명 (예: Taiwan)'
        required: false
      cur:
        description: '--pay 용 통화코드 (예: TWD)'
        required: false
      day:
        description: '하루만 볼 날짜 YYYYMMDD (비우면 전 기간 — 스캔 1.5GB)'
        required: false
      limit:
        description: '찍을 이벤트 줄 수'
        required: false
        default: '400'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성
        run: pip install --quiet google-cloud-bigquery
      - name: 서비스계정 키 파일화
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      # 입력은 전부 env 로만 넘긴다 — 쉘 줄에 직접 끼워 넣으면 국가명 같은 자유 입력이
      # 그대로 명령이 된다. 모드만 식으로 고르고 인자 조립은 bash 에서 한다.
      - name: 조회
        working-directory: tools
        env:
          MODE: ${{ inputs.vercmp == 'true' && 'vercmp' || (inputs.city == 'true' && 'city' || (inputs.fake == 'true' && 'fake' || (inputs.scan == 'true' && 'scan' || (inputs.pay == 'true' && 'pay' || 'tag')))) }}
          TAG: ${{ inputs.tag }}
          DAY: ${{ inputs.day }}
          LIMIT: ${{ inputs.limit }}
          COUNTRY: ${{ inputs.country }}
          CUR: ${{ inputs.cur }}
        run: |
          args=()
          case "$MODE" in
            tag) args+=(--tag "$TAG") ;;
            pay) args+=(--pay --country "$COUNTRY" --cur "$CUR") ;;
            *)   args+=("--$MODE") ;;
          esac
          if [ -n "$DAY" ]; then args+=(--day "$DAY"); fi
          python3 probe.py "${args[@]}" --limit "$LIMIT"
