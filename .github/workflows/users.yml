# 전체 가입자 목록 수집 — BigQuery(GA4 확정 일별 테이블) → docs/data/users/YYYY-MM-DD.json
#
# 하루 한 번이면 된다. 확정 테이블만 읽고 '어제까지'만 받는다 — 오늘 몫은 실시간 뷰가 맡는다.
# 이미 받은 날짜는 index.json 을 보고 건너뛰므로, 늦게 확정된 날만 따라잡는다.
#
# 하루치 파일은 한 번 쓰고 다시 안 바뀐다. 한 파일에 다 담으면 매일 2MB를 통째로 다시
# 커밋하게 돼서 리포가 연 수백 MB씩 불어나는데, 쪼개 두면 히스토리가 쌓이지 않는다.
name: users

# ⚠ 자동 실행(schedule)을 전부 뗐다(형 지시 2026-10-22). 이 보드는 형이 볼 때만
# 최신이면 되는데, 예약 실행이 BigQuery 를 계속 긁어 10월에 무료 구간 1TB 를 넘겼다
# (실측 2.16TiB). 이제 **요청할 때만** 돈다 — Actions 탭에서 "Run workflow" 또는
# Claude 에게 "업데이트".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: users
  cancel-in-progress: false

jobs:
  users:
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성
        if: env.GCP_SA_KEY != ''
        run: pip install --quiet google-cloud-bigquery

      - name: 서비스계정 키 파일화
        if: env.GCP_SA_KEY != ''
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 가입자 수집
        if: env.GCP_SA_KEY != ''
        working-directory: tools
        run: python3 users.py

      # 국가별 효율 — 같은 자격증명·같은 하루 1회라 여기 얹는다(스캔 ~400MB/회).
      - name: 국가별 효율
        if: env.GCP_SA_KEY != ''
        working-directory: tools
        run: python3 geo_roi.py --days 60 --write

      # 위험 신호 — 같은 자격증명으로 이미 전 기간을 훑는 잡이라 여기 얹는다.
      - name: 위험 신호 감시
        if: env.GCP_SA_KEY != ''
        working-directory: tools
        run: python3 anomaly.py

      - name: 커밋
        if: env.GCP_SA_KEY != ''
        run: |
          git config user.name  "secondact-bot"
          git config user.email "34591718+Purplusnow@users.noreply.github.com"
          git add docs/data/users docs/data/anomaly.json docs/data/geo_roi.json
          if git diff --cached --quiet -- docs/data/users docs/data/anomaly.json docs/data/geo_roi.json; then
            echo "새로 받은 날짜 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "가입자 수집: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
          # 다른 수집 잡이나 사람 커밋이 사이에 끼면 푸시가 밀린다(! [rejected] fetch first).
          # 재시도가 없으면 수집은 성공해 놓고 그 회차 데이터를 통째로 버리게 된다 —
          # 10/02 00:34 스케줄 실행이 그렇게 날아갔다. 리베이스하고 몇 번 다시 민다.
          for i in 1 2 3 4 5; do
            git push && break
            echo "푸시 밀림 — 리베이스 후 재시도 $i"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
